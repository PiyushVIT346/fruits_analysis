<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1120" height="580" rx="18" fill="#ffffff"/>
  <rect x="1" y="1" width="1118" height="578" rx="18" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <text x="560" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Automated Fresh Produce Price Tracker: Architecture</text>
  <text x="560" y="66" text-anchor="middle" font-size="13" fill="#64748b">Data flows left to right; GitHub Actions orchestrates the daily run</text>

  <!-- GitHub Actions -->
  <g filter="url(#sh)">
    <rect x="300" y="92" width="270" height="62" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  </g>
  <text x="435" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">GitHub Actions</text>
  <text x="435" y="140" text-anchor="middle" font-size="12" fill="#5b21b6">daily cron + manual trigger</text>

  <!-- CEDA API -->
  <g filter="url(#sh)">
    <rect x="30" y="215" width="210" height="110" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  </g>
  <text x="135" y="245" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">CEDA Agri Market API</text>
  <text x="135" y="267" text-anchor="middle" font-size="12" fill="#166534">Ashoka University / Agmarknet</text>
  <text x="135" y="287" text-anchor="middle" font-size="12" fill="#166534">/commodities /geographies</text>
  <text x="135" y="305" text-anchor="middle" font-size="12" fill="#166534">/prices /quantities</text>

  <!-- Pipeline -->
  <g filter="url(#sh)">
    <rect x="300" y="195" width="270" height="150" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  </g>
  <text x="435" y="225" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Python pipeline</text>
  <text x="435" y="245" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1d4ed8">pipeline_ceda.py</text>
  <text x="435" y="271" text-anchor="middle" font-size="12" fill="#1e40af">Fetch · clean · deduplicate</text>
  <text x="435" y="291" text-anchor="middle" font-size="12" fill="#1e40af">Rate-limit aware, resumable</text>
  <text x="435" y="311" text-anchor="middle" font-size="12" fill="#1e40af">Price / supply indices + signals</text>
  <text x="435" y="331" text-anchor="middle" font-size="12" fill="#1e40af">Prompt building + fallback</text>

  <!-- Mesh / Claude -->
  <g filter="url(#sh)">
    <rect x="30" y="420" width="210" height="100" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  </g>
  <text x="135" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">Mesh API · Claude</text>
  <text x="135" y="474" text-anchor="middle" font-size="12" fill="#9a3412">OpenAI-compatible gateway</text>
  <text x="135" y="494" text-anchor="middle" font-size="12" fill="#9a3412">Executive bullet summaries</text>

  <!-- Data folder -->
  <g filter="url(#sh)">
    <rect x="650" y="195" width="210" height="150" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  </g>
  <text x="755" y="225" text-anchor="middle" font-size="15" font-weight="700" fill="#713f12">data/ (CSV in GitHub)</text>
  <text x="755" y="251" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#854d0e">raw_prices.csv</text>
  <text x="755" y="271" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#854d0e">daily_summary.csv</text>
  <text x="755" y="291" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#854d0e">ai_latest.csv</text>
  <text x="755" y="311" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#854d0e">ai_history.csv</text>
  <text x="755" y="331" text-anchor="middle" font-size="12" font-family="Consolas, Menlo, monospace" fill="#854d0e">state.json</text>

  <!-- Streamlit -->
  <g filter="url(#sh)">
    <rect x="930" y="110" width="170" height="90" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  </g>
  <text x="1015" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#831843">Streamlit app</text>
  <text x="1015" y="162" text-anchor="middle" font-size="12" fill="#9d174d">dashboard/app.py</text>
  <text x="1015" y="182" text-anchor="middle" font-size="12" fill="#9d174d">Plotly charts + AI brief</text>

  <!-- Sheets -->
  <g filter="url(#sh)">
    <rect x="930" y="285" width="170" height="70" rx="12" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
  </g>
  <text x="1015" y="314" text-anchor="middle" font-size="15" font-weight="700" fill="#164e63">Google Sheets</text>
  <text x="1015" y="336" text-anchor="middle" font-size="12" fill="#155e75">IMPORTDATA from raw CSV URLs</text>

  <!-- Looker -->
  <g filter="url(#sh)">
    <rect x="930" y="410" width="170" height="80" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  </g>
  <text x="1015" y="440" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">Looker Studio</text>
  <text x="1015" y="462" text-anchor="middle" font-size="12" fill="#3730a3">Interactive BI report</text>
  <text x="1015" y="480" text-anchor="middle" font-size="12" fill="#3730a3">+ AI summary card</text>

  <!-- Arrows -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)">
    <!-- CEDA -> pipeline -->
    <path d="M240 270 L298 270"/>
    <!-- Actions -> pipeline -->
    <path d="M435 154 L435 193"/>
    <!-- pipeline -> data -->
    <path d="M570 270 L648 270"/>
    <!-- Actions commits -> data -->
    <path d="M570 123 L755 123 L755 193" stroke-dasharray="6 5"/>
    <!-- data -> Streamlit -->
    <path d="M860 230 L895 230 L895 155 L928 155"/>
    <!-- data -> Sheets -->
    <path d="M860 305 L928 320"/>
    <!-- Sheets -> Looker -->
    <path d="M1015 355 L1015 408"/>
  </g>
  <!-- bidirectional pipeline <-> Claude -->
  <path d="M370 345 L370 470 L242 470" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M242 440 L400 440 L400 347" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Arrow labels -->
  <text x="269" y="260" text-anchor="middle" font-size="11" fill="#475569">prices +</text>
  <text x="269" y="285" text-anchor="middle" font-size="11" fill="#475569">arrivals</text>
  <text x="609" y="258" text-anchor="middle" font-size="11" fill="#475569">write</text>
  <text x="663" y="113" text-anchor="middle" font-size="11" fill="#475569">commits updated CSVs</text>
  <text x="250" y="489" text-anchor="start" font-size="11" fill="#475569">computed facts (JSON)</text>
  <text x="250" y="432" text-anchor="start" font-size="11" fill="#475569">bullet summary</text>
  <text x="1040" y="385" text-anchor="start" font-size="11" fill="#475569">connect</text>

  <!-- Legend -->
  <text x="560" y="548" text-anchor="middle" font-size="12" fill="#64748b">Solid arrow = data flow · Dashed arrow = automation commit · Looker Studio and Streamlit are alternative front ends</text>
</svg>
